# Custom_OpenClash_Rules / Custom_Clash.ini 迁移版
# 适用于 Clash Party 的 YAML 覆写（Mihomo）
# 作用：保留订阅中的 proxies 节点；替换原规则和 proxy-groups；追加本模板所需的 rule-providers。
# 注意：此文件不会覆写 DNS、端口、TUN 等配置。

rule-providers:
  custom-direct-domain:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.mrs
    path: ./ruleset/custom-direct-domain.mrs
    interval: 1800
  custom-direct-classical-ip:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml
    path: ./ruleset/custom-direct-classical-ip.yaml
    interval: 28800
  custom-proxy-domain:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.mrs
    path: ./ruleset/custom-proxy-domain.mrs
    interval: 28800
  custom-proxy-classical-ip:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml
    path: ./ruleset/custom-proxy-classical-ip.yaml
    interval: 28800
  steam-cdn-domain:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Domain.mrs
    path: ./ruleset/steam-cdn-domain.mrs
    interval: 28800
  steam-cdn-classical-ip:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Classical_IP.yaml
    path: ./ruleset/steam-cdn-classical-ip.yaml
    interval: 28800
  custom-port-direct:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml
    path: ./ruleset/custom-port-direct.yaml
    interval: 28800

# 按模板原本的顺序替换规则；不要改成 +rules，否则原订阅中的规则可能抢先命中。
