;基于 Aethersailor Lite / 标准版规则重新整理
;用途：出门在外访问家里私有网络 + 较完整代理海外服务
;项目参考：https://github.com/Aethersailor/Custom_OpenClash_Rules

[custom]
;设置规则标志位
;规则从上往下匹配，命中即停止

;【核心】私有网络地址全部走回家节点
ruleset=🚀 手动选择,[]GEOSITE,private
ruleset=🚀 手动选择,[]GEOIP,private,no-resolve

;项目自维护的直连规则
ruleset=🎯 全球直连,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.mrs,1800
ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800

;项目自维护的代理规则（补充海外）
ruleset=🚀 手动选择,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.mrs,28800
ruleset=🚀 手动选择,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800

;国内游戏直连
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn
;游戏下载 CDN 直连
ruleset=🎯 全球直连,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Game_Download_CDN_Domain.mrs,28800
ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Game_Download_CDN_Classical_IP.yaml,28800
;BT Tracker 直连
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker

;===== 海外相关全部走回家节点 =====
ruleset=🚀 手动选择,[]GEOSITE,category-communication
ruleset=🚀 手动选择,[]GEOSITE,category-social-media-!cn
ruleset=🚀 手动选择,[]GEOSITE,openai
ruleset=🚀 手动选择,[]GEOSITE,category-ai-!cn
ruleset=🚀 手动选择,[]GEOSITE,github
ruleset=🚀 手动选择,[]GEOSITE,category-speedtest
ruleset=🚀 手动选择,[]GEOSITE,google
ruleset=🚀 手动选择,[]GEOSITE,youtube
ruleset=🚀 手动选择,[]GEOSITE,netflix
ruleset=🚀 手动选择,[]GEOSITE,disney
ruleset=🚀 手动选择,[]GEOSITE,tiktok
ruleset=🚀 手动选择,[]GEOSITE,spotify
ruleset=🚀 手动选择,[]GEOSITE,gfw
ruleset=🚀 手动选择,[]GEOIP,telegram,no-resolve
ruleset=🚀 手动选择,[]GEOIP,facebook,no-resolve
ruleset=🚀 手动选择,[]GEOIP,twitter,no-resolve
ruleset=🚀 手动选择,[]GEOIP,google,no-resolve
ruleset=🚀 手动选择,[]GEOIP,netflix,no-resolve

;国内兜底直连
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve

;非标端口（BT/PT 优化）
ruleset=🔀 非标端口,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800

;漏网之鱼默认走代理（防止海外漏网）
ruleset=🐟 漏网之鱼,[]FINAL
;设置规则标志位结束

;设置节点分组标志位（精简）
custom_proxy_group=🚀 手动选择`select`[]♻️ 自动选择`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 手动选择`[]♻️ 自动选择`[]🎯 全球直连`.*
custom_proxy_group=🔀 非标端口`select`[]🐟 漏网之鱼`[]🎯 全球直连
custom_proxy_group=🎯 全球直连`select`[]DIRECT`https://www.gstatic.com/generate_204
;设置分组标志位

;下方参数请勿修改
enable_rule_generator=true
overwrite_original_rules=true